components:
  schemas:
    RelatedVirtualClassroom:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: integer
          example: 150157
        title:
          type: string
          example: Lecture 1
    Lecture:
      type: object
      required:
      - id
      - startsAt
      - endsAt
      - type
      - virtualClassrooms
      - description
      - courseId
      - courseName
      - teacherId
      - place
      properties:
        id:
          type: number
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        type:
          type: string
        virtualClassrooms:
          type: array
          items:
            $ref: '#/components/schemas/RelatedVirtualClassroom'
        description:
          type: string
          nullable: true
        courseId:
          type: integer
        courseName:
          type: string
        teacherId:
          type: integer
          example: 150157
        place:
          $ref: '#/components/schemas/PlaceRef'
    PlaceRef:
      type: object
      required:
      - buildingId
      - floorId
      - roomId
      - siteId
      - name
      properties:
        buildingId:
          type: string
        floorId:
          type: string
        roomId:
          type: string
        siteId:
          type: string
        name:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
