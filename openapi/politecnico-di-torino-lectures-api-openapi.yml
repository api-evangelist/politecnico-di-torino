    get:
      operationId: Lectures_getLectures
      summary: List lectures | Elenca lezioni
      parameters:
      - name: fromDate
        in: query
        required: false
        description: First day - defaults to 7 days before today
        schema:
          type: string
          format: date
        explode: false
      - name: toDate
        in: query
        required: false
        description: Last day - defaults to 7 days after today
        schema:
          type: string
          format: date
        explode: false
      - name: courseIds[]
        in: query
        required: false
        description: Only include lectures belonging to these courses
        schema:
          type: array
          items:
            type: number
      responses:
