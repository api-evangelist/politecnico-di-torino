          nullable: true
        videoUrl:
          type: string
        duration:
          type: string
        type:
          type: string
          enum:
          - recording
      allOf:
      - $ref: '#/components/schemas/VirtualClassroomBase'
    CourseDirectoryEntry:
      type: object
