      - content
      properties:
        title:
          type: string
          example: Title
        content:
          type: string
          example: HTML content
    RelatedVirtualClassroom:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: integer
          example: 150157
        title:
          type: string
          example: Lecture 1
    VirtualClassroom:
      type: object
      oneOf:
      - $ref: '#/components/schemas/VirtualClassroomLive'
      - $ref: '#/components/schemas/VirtualClassroomRecording'
      discriminator:
        propertyName: type
        mapping:
          live: '#/components/schemas/VirtualClassroomLive'
          recording: '#/components/schemas/VirtualClassroomRecording'
    Lecture:
      type: object
      required:
      - id
      - startsAt
      - endsAt
      - type
      - virtualClassrooms
      - description
      - courseId
      - courseName
      - teacherId
      - place
      properties:
        id:
          type: number
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        type:
          type: string
        virtualClassrooms:
          type: array
          items:
            $ref: '#/components/schemas/RelatedVirtualClassroom'
        description:
          type: string
          nullable: true
        courseId:
          type: integer
        courseName:
          type: string
        teacherId:
          type: integer
          example: 150157
        place:
          $ref: '#/components/schemas/PlaceRef'
    PlaceRef:
      type: object
      required:
      - buildingId
      - floorId
      - roomId
      - siteId
      - name
      properties:
        buildingId:
          type: string
        floorId:
          type: string
        roomId:
          type: string
        siteId:
          type: string
        name:
          type: string
    CourseModuleEdition:
      type: object
      required:
      - year
      - id
      properties:
        year:
          type: string
          example: '2021'
        id:
          type: integer
          example: 244577
    CoursePreferencesRequest:
      type: object
      properties:
        notifications:
          type: object
          properties:
            notices:
              type: boolean
              example: true
            files:
              type: boolean
              example: true
            lectures:
              type: boolean
              example: true
    VideoLecture:
      type: object
      required:
      - id
      - title
      - teacherId
      - abstract
      - coverUrl
      - videoUrl
      - audioUrl
      - createdAt
      - duration
      properties:
        id:
          type: integer
        title:
          type: string
        teacherId:
          type: integer
        abstract:
          type: string
        coverUrl:
          type: string
        videoUrl:
          type: string
        audioUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        duration:
          type: string
    CourseModule:
      type: object
      required:
      - id
      - shortcode
      - name
      - teachingPeriod
      - teacherId
      - teacherName
      - previousEditions
      - isOverBooking
      - enrollmentRole
      - year
      properties:
        id:
          type: integer
          nullable: true
          description: 'The identifier for the current instance of this course.

            If null this is not a teaching (such as thesis), it won''t have a course page'
          example: 258674
        shortcode:
          type: string
          example: 01NYHOV
        name:
          type: string
          example: System and device programming
        teachingPeriod:
          type: string
          description: The semester(s) this course belongs to
          example: 2-2
        teacherId:
          type: integer
          nullable: true
          example: 2893
        teacherName:
          type: string
          nullable: true
          example: Mario Rossi
        previousEditions:
          type: array
          items:
            $ref: '#/components/schemas/CourseModuleEdition'
          description: Previous editions of this course that were part of the student's PSP
          example:
          - id: 244577
            year: '2021'
        isOverBooking:
          type: boolean
          example: false
        enrollmentRole:
          allOf:
          - $ref: '#/components/schemas/CourseEnrollmentRole'
          description: Type of enrollment of the user for this course
          example: student
        year:
          type: string
          example: '2022'
      example:
        id: 251008
        name: Programming Module A
        shortcode: ProgModA
        teachingPeriod: 2-2
        teacherId: 3001
        teacherName: Mario Rossi
        previousEditions:
        - id: 251005
          year: '2024'
        isOverBooking: false
        enrollmentRole: student
        year: '2025'
    CourseDirectory:
      type: object
      required:
      - id
      - name
      - files
      - type
      properties:
        id:
          type: string
        name:
          type: string
        files:
          $ref: '#/components/schemas/CourseDirectoryContent'
        type:
          type: string
          enum:
          - directory
      example:
        name: Root
        id: '1234'
        type: directory
        files:
        - type: directory
          id: '1'
          name: Week 1
          files: []
