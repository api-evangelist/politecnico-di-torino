        propertyName: type
        mapping:
          directory: '#/components/schemas/CourseDirectory'
          file: '#/components/schemas/CourseFileOverview'
    CourseFileOverview:
      type: object
      required:
      - id
      - name
      - sizeInKiloBytes
      - mimeType
      - createdAt
      - type
      - checksum
