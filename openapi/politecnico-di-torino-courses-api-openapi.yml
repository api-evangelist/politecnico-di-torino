      type: array
      items:
        $ref: '#/components/schemas/CourseDirectoryEntry'
    Course:
      type: object
      required:
      - cfu
      - links
      - moodleCourses
      - vcPreviousYears
      - vcOtherCourses
      - notifications
      - staff
      properties:
        cfu:
          type: integer
          example: 10
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                example: https://docs.google.com/document/d/13hpWEDQxziSkhSU0PuqxMXntqZYp3ffDKZ2-umQ7Ywo/edit?usp=sharing
              description:
                type: string
                example: Calendario settimanale dei contenuti del corso
            required:
            - url
        moodleCourses:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Analisi Matematica I
              id:
                type: string
                example: '645376'
          nullable: true
        vcPreviousYears:
          type: array
          items:
            $ref: '#/components/schemas/CourseModuleEdition'
          example:
          - id: 244577
            year: '2021'
        vcOtherCourses:
          type: array
          items:
            type: object
            properties:
              year:
                type: string
                example: '2021'
              id:
                type: integer
                example: 244577
              name:
                type: string
                example: Fisica II
            required:
            - year
            - id
            - name
          description: Other editions/courses to be included in virtual classrooms
        notifications:
          type: object
          properties:
            notices:
              type: boolean
              example: true
            files:
              type: boolean
              example: true
            lectures:
              type: boolean
              example: true
          required:
          - notices
          - files
          - lectures
        staff:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              id:
                type: number
                example: 244577
            required:
            - role
            - id
