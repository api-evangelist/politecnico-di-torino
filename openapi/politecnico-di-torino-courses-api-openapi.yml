        id:
          type: string
          example: '33352562'
        name:
          type: string
          example: Laboratori
        sizeInKiloBytes:
          type: integer
          example: 305
        mimeType:
          type: string
          example: application/x-zip-compressed
        createdAt:
          type: string
          format: date-time
          example: '2022-08-31T14:00:00Z'
        type:
          type: string
          enum:
          - file
        checksum:
          type: string
          example: deadbeefcafebabe0000000000000000
      example:
        type: file
        id: '2'
        name: Lecture1.pdf
        sizeInKiloBytes: 2048
        mimeType: application/pdf
        createdAt: '2024-06-01T10:00:00Z'
        checksum: deadbeefcafebabe0000000000000000
    UpdateAssignmentRequest:
      type: object
