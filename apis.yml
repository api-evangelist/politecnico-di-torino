- aid: politecnico-di-torino:public-search-services
  name: PoliTO Public Search Web Services (people, departments, teachings, rooms)
  x-operator: institution
  description: >-
    Four keyless JSON web services operated by Politecnico di Torino on its own hosts, found on
    2026-08-30 in the client JavaScript behind https://www.polito.it/en/search and probed live.
    search_people.ashx, search_departments.ashx and search_teachings.ashx run at
    mypoli.polito.it/dotnet/ws_anagrafe (130.192.182.138); the campus room locator
    motore-di-ricerca/localijson.php runs at legacyprod.polito.it (130.192.182.100). Both hosts sit
    inside the university's own 130.192.0.0/16 GARR address space with no vendor CNAME, so this is
    institution-operated engineering rather than a tenant deployment. All four returned HTTP 200 with
    application/json and real institutional data to an anonymous caller carrying no credential, which
    makes this the ONLY Politecnico di Torino API surface an outsider can actually call — the
    documented app.didattica.polito.it REST API behind the official mobile apps returns 403 without a
    PoliTO bearer token. The teachings service is the closest thing the university operates to a public
    course-catalog API. Politecnico di Torino publishes no specification, documentation or terms of use
    for any of them and does not present them as a developer product; the OpenAPI recorded here is
    DERIVED from live probing by API Evangelist and is stamped as such. Paging is advertised and not
    honoured — current_page and page_size echo back 1 and 5 whatever is sent — and omitting the
    required q parameter returns HTTP 500 rather than 400. The people service returns personal data
    about named staff including institutional email addresses; no real personal record is reproduced in
    the derived contract.
