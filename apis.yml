- aid: politecnico-di-torino:open-data
  name: PoliTO Open Data
  description: >-
    Institutional open-data portal publishing freely reusable academic datasets (study programs and courses,
    student enrollment, international students, graduates, mobility, and doctoral programs) under attribution
    and share-alike terms. The portal lists downloadable datasets; no programmatic API or developer documentation
    is published for it.
