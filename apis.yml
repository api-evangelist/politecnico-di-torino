- aid: politecnico-di-torino:iris-oai
  name: IRIS PoliTO OAI-PMH Metadata Service (CINECA deployment)
  x-operator: tenant
  description: >-
    OAI-PMH 2.0 harvesting service over IRIS, Politecnico di Torino's institutional research repository,
    reachable at https://iris.polito.it/oai/request. Verified live on 2026-08-30 across Identify, ListMetadataFormats,
    ListSets and ListRecords: repositoryName "IRIS - POLITO - prod", repositoryIdentifier iris.polito.it,
    earliest datestamp 2015-06-30, three metadata prefixes (didl, ore, oai_dc), DSpace-style community
    and collection sets under the 11583 handle prefix, and 100 real Dublin Core records with a resumptionToken
    on the first page. Recorded as tenant rather than institution: iris.polito.it CNAMEs to polito.prod.iris.cineca.it
    and the Identify response gives adminEmail noreply@cineca.it. IRIS is CINECA's research-information
    product, deployed across most Italian universities. The research record is PoliTO's; the harvesting
    contract is CINECA's, and no IRIS contract is saved into this repository.
  humanURL: https://iris.polito.it/
  baseURL: https://iris.polito.it/oai/request
