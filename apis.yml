x-coverage:
  state: covered
  reason: covered
  detail: >-
    Every surface class the university pipeline hunts was probed on 2026-08-30, and Politecnico di Torino
    is one of the few institutions in this cohort whose headline API is genuinely its own. The REST
    API behind the official student and faculty apps runs on app.didattica.polito.it, its OpenAPI is
    authored by the university in TypeSpec and published in the verified @polito GitHub organisation,
    and no vendor appears anywhere in servers[], info.title, info.contact or info.termsOfService. Nothing
    was removed for misattribution. What was repaired is ours: all 15 refined OpenAPIs wore the welded
    title 'Polito Faculty Announcements <Tag> API' because refine-openapis carried the first split output's
    identity onto every later one, and seven of them (Esc, Exams, Job offers, Offering, Student, Surveys,
    Tickets) describe paths that exist only in the Polito Students API. Each was re-based from its true
    parent and given an x-refined-from block; servers[] needed no repair because both parent contracts
    declare the same two hosts. The 30 derived collections were re-titled to match. Two institution-operated
    surfaces were found that this profile had never recorded: a Shibboleth SAML 2.0 identity provider
    at idp.polito.it, registered in IDEM GARR and eduGAIN since 2020-07-24 with Sirtfi asserted, and
    a status page at status.polito.it. One tenant relationship was recorded: the IRIS OAI-PMH service
    at iris.polito.it, functional across all four verbs but CNAMEd to polito.prod.iris.cineca.it and
    administered from noreply@cineca.it. The open-data portal is downloads-only with no API behind it;
    data.polito.it resolves but does not answer, and api.polito.it does not resolve. There is no llms.txt
    and no .well-known/security.txt. One dead pointer was repaired: the License pointer at rn-apps/blob/main/LICENSE
    returned 404 and the file is LICENSE.md. Finally, a staleness finding: openapi/_original/ was harvested
    on 2026-06-03 and upstream has since moved. Faculty grew 42 to 47 paths; student grew 80 to 86 net,
    but that net figure hides the real drift — upstream ADDED 17 student paths and REMOVED 11, having
    re-based the whole ticket tree from /tickets/* to /student/tickets/* and replaced /me with
    /student/career, so 11 paths this repo still describes no longer exist. Both contracts also gained an
    'Event Admissions' tag and /auth/profile, /auth/profile/picture, /auth/profile/token and
    /auth/serviceLink/smartcard. The harvested contracts were deliberately NOT re-refined in this run:
    refine-openapis is what welded the wrong identities on in the first place, and re-running it would
    discard a verified hand repair. The staleness is recorded here instead and left for a controlled
    re-harvest. Separately, a real surface this profile had never recorded was found on 2026-08-30 by
    reading the JavaScript behind https://www.polito.it/en/search: four keyless JSON web services —
    search_people.ashx, search_departments.ashx and search_teachings.ashx on mypoli.polito.it, and
    motore-di-ricerca/localijson.php on legacyprod.polito.it — each returning HTTP 200, application/json
    and real institutional data to an anonymous caller. Both hosts resolve into 130.192.182.x, the
    university's own GARR space, with no vendor CNAME, so they are institution-operated. This materially
    changes the profile: PoliTO does have an anonymously callable public API surface, it is simply
    undocumented and unadvertised. A derived OpenAPI is saved for it, stamped method: derived and
    not_published_by_provider: true, with synthetic examples only because search_people returns named
    staff and their institutional email addresses. Finally, HPC@PoliTO at hpc.polito.it is a genuine
    institution-run academic computing service — surface class 8 — recorded as a ResearchComputing
    pointer; its allocation process is entirely mailto-based and it exposes no API.
