---
aid: politecnico-di-torino
name: Politecnico di Torino
x-type: university
x-category: Technical University
description: >-
  Politecnico di Torino (PoliTO) is Italy's oldest technical university, founded in Turin in 1859, with
  roughly 38,000 students across engineering, architecture and design. Unusually for this cohort, its
  programmable footprint is genuinely its own rather than a vendor's: the university publishes the OpenAPI
  definition of the REST API behind its official student and faculty mobile applications in the verified
  @polito GitHub organisation (polito/api-spec, authored in TypeSpec and emitted as two client contracts,
  Polito Faculty API and Polito Students API), and the React Native apps that consume it are open-sourced
  under EUPL-1.2 in polito/rn-apps and polito/students-app. That API runs on the university's own host,
  app.didattica.polito.it, and covers announcements, authentication with MFA, room and slot bookings,
  courses, lectures, news, people, places, exams, grades, degree offering, job offers, surveys, support
  tickets and the European Student Card. It is not a self-service developer programme: the production
  base path returns 403 to an anonymous caller, every operation is bearer authenticated against a PoliTO
  account, and no key can be requested by an outsider. Two further institution-operated machine-readable
  surfaces exist and are recorded here for the first time — a Shibboleth SAML 2.0 identity provider
  registered in IDEM GARR and eduGAIN since 2020, and an OAI-PMH 2.0 harvesting service over the IRIS
  research repository, the latter a CINECA tenant deployment rather than PoliTO engineering. A fourth
  institution-operated surface was found on 2026-08-30 and is the only one an outsider can actually call:
  four keyless JSON web services behind the polito.it site search — staff, departments and teachings at
  mypoli.polito.it/dotnet/ws_anagrafe and a campus room locator at legacyprod.polito.it — all returning
  HTTP 200 and real data with no credential, on hosts inside the university's own GARR address space.
  They are undocumented and unversioned, PoliTO does not present them as a developer product, and the
  OpenAPI held here is derived from probing rather than published. The university also runs HPC@PoliTO,
  an academic computing service managed in-house, whose allocation process is entirely by email with no
  programmatic surface. The institutional open-data portal publishes downloadable datasets only, with no
  API behind it, and there is no data.polito.it or api.polito.it host in service.
