- aid: politecnico-di-torino:identity-federation
  name: Politecnico di Torino Shibboleth Identity Provider (IDEM GARR / eduGAIN)
  x-operator: institution
  description: >-
    Machine-readable SAML 2.0 identity-provider metadata for Politecnico di Torino, served from the
    university's own address space at idp.polito.it (130.192.55.75) and mirrored at idem.polito.it.
    Verified live on 2026-08-30: 13,373 bytes of application/xml carrying an IDPSSODescriptor and an
    AttributeAuthorityDescriptor, protocol support for SAML 2.0 and SAML 1.1, HTTP-Redirect, HTTP-POST
    and HTTP-POST-SimpleSign SSO bindings with matching SLO endpoints, and shibmd:Scope polito.it. The
    entityID https://idem.polito.it/idp/shibboleth is registered in the Italian national federation
    IDEM GARR and published to eduGAIN, first seen 2020-07-24, with the eduGAIN connectivity check passing
    and Sirtfi asserted. A companion service provider, EduGateway Polito (https://idemidp.polito.it/shibboleth),
    is registered under the GEANT Data Protection Code of Conduct. This is the surface class the university
    cohort most consistently fails to record, and it is institution-operated by definition.
  humanURL: https://idp.polito.it/idp/shibboleth
  baseURL: https://idp.polito.it/idp/shibboleth
  tags:
